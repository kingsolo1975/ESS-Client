<header class="sticky top-0 z-50 border-b border-black/5 bg-white shadow-[0_1px_0_rgba(0,0,0,0.04)]">
  <div class="ess-container">
    <div class="flex min-h-[4rem] items-center justify-between gap-6 py-2.5 lg:min-h-[4.5rem] lg:py-3">
      <a href="#top" class="flex items-center" aria-label="EnlightenSoft home">
        <img
          *ngIf="!imageError()"
          src="assets/brand/enlightensoft-logo-cropped.png"
          alt="EnlightenSoft"
          class="h-auto max-h-[40px] w-[190px] object-contain lg:max-h-[50px] lg:w-[250px]"
          (error)="handleLogoError()"
        />
        <span *ngIf="imageError()" class="text-xl font-normal tracking-[0.08em] text-neutral-950 sm:text-2xl">
          EnlightenSoft<sup>&reg;</sup>
        </span>
      </a>

      <nav class="hidden items-center gap-6 lg:flex" aria-label="Primary">
        <a
          *ngFor="let item of navigationItems"
          [href]="'#' + item.fragment"
          class="text-sm font-medium tracking-[0.02em] text-neutral-800 transition-colors duration-200 hover:text-amber-700"
        >
          {{ item.label }}
        </a>
      </nav>

      <div class="hidden items-center gap-3 lg:flex">
        <a
          href="#contact"
          class="rounded-full border border-amber-500/25 bg-[#d4af37] px-5 py-2.5 text-sm font-medium tracking-[0.03em] text-black shadow-sm transition-colors duration-200 hover:bg-amber-500"
        >
          Talk to ESS
        </a>
      </div>

      <button
        type="button"
        class="inline-flex h-10 w-10 items-center justify-center rounded-full border border-black/10 text-neutral-900 lg:hidden"
        (click)="toggleMobileMenu()"
        [attr.aria-expanded]="mobileMenuOpen()"
        aria-label="Toggle navigation"
      >
        <svg
          *ngIf="!mobileMenuOpen()"
          aria-hidden="true"
          viewBox="0 0 24 24"
          class="h-5 w-5"
          fill="none"
          stroke="currentColor"
          stroke-linecap="round"
          stroke-width="1.8"
        >
          <path d="M4 7h16M4 12h16M4 17h16" />
        </svg>
        <svg
          *ngIf="mobileMenuOpen()"
          aria-hidden="true"
          viewBox="0 0 24 24"
          class="h-5 w-5"
          fill="none"
          stroke="currentColor"
          stroke-linecap="round"
          stroke-width="1.8"
        >
          <path d="M6 6l12 12M18 6L6 18" />
        </svg>
      </button>
    </div>

    <div
      *ngIf="mobileMenuOpen()"
      class="animate-fade-up border-t border-black/5 bg-white py-3 lg:hidden"
    >
      <nav class="flex flex-col gap-3" aria-label="Mobile">
        <a
          *ngFor="let item of navigationItems"
          [href]="'#' + item.fragment"
          class="rounded-2xl px-4 py-2.5 text-sm font-medium tracking-[0.02em] text-neutral-800 transition-colors duration-200 hover:bg-neutral-100 hover:text-amber-700"
          (click)="closeMobileMenu()"
        >
          {{ item.label }}
        </a>
        <a
          href="#contact"
          class="rounded-2xl bg-[#d4af37] px-5 py-2.5 text-center text-sm font-medium tracking-[0.03em] text-black shadow-sm transition-colors duration-200 hover:bg-amber-500"
          (click)="closeMobileMenu()"
        >
          Talk to ESS
        </a>
      </nav>
    </div>
  </div>
</header>
