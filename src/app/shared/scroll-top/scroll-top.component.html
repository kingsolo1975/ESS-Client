<button
  *ngIf="isVisible()"
  type="button"
  class="fixed bottom-5 right-5 z-50 inline-flex h-12 w-12 items-center justify-center rounded-full border border-amber-400/35 bg-ess-abyss/90 text-amber-300 shadow-[0_18px_40px_-22px_rgba(212,175,55,0.55)] backdrop-blur-md transition hover:-translate-y-0.5 hover:bg-ess-abyss sm:bottom-7 sm:right-7"
  (click)="scrollToTop()"
  aria-label="Scroll to top"
>
  <svg
    aria-hidden="true"
    viewBox="0 0 24 24"
    class="h-4 w-4"
    fill="none"
    stroke="currentColor"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-width="1.8"
  >
    <path d="M12 18V6" />
    <path d="M7 11l5-5 5 5" />
  </svg>
</button>
