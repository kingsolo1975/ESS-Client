<button
  *ngIf="isVisible()"
  type="button"
  class="ess-scroll-button"
  (click)="scrollToTop()"
  aria-label="Scroll to top"
>
  <svg
    aria-hidden="true"
    viewBox="0 0 24 24"
    class="h-4 w-4"
    fill="none"
    stroke="currentColor"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-width="1.8"
  >
    <path d="M12 18V6" />
    <path d="M7 11l5-5 5 5" />
  </svg>
</button>
