<div class="grid gap-6 md:grid-cols-2 xl:grid-cols-4">
  <article
    *ngFor="let feature of features()"
    class="panel-surface group flex h-full flex-col p-7 transition duration-300 hover:-translate-y-1 hover:shadow-glow"
  >
    <div class="flex items-center justify-between">
      <span class="text-sm font-medium text-[#e56705]">{{ feature.badge }}</span>
      <span class="h-2 w-2 rounded-full bg-[#f57c20]"></span>
    </div>
    <h3 class="mt-8 text-xl font-normal text-neutral-950">{{ feature.title }}</h3>
    <p class="mt-4 text-sm text-neutral-600">
      {{ feature.description }}
    </p>
  </article>
</div>
